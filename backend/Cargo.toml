[package]
name = "port-helper"
version = "0.1.1"
description = "开发者端口占用查询与进程管理工具"
edition = "2021"
publish = false

[lib]
name = "port_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# 只启用进程相关模块（磁盘、网络、传感器、用户等用不到）
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Services", "Win32_UI_Shell", "Wdk_System_Threading", "Win32_System_Kernel"] }

# macOS / Linux：端口表（macOS 走 libproc，Linux 走 netlink）与信号、权限相关的系统调用
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
netstat2 = "0.11.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
